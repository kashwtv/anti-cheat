[package]
name = "anticheat-engine"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Core scanning engine for AntiCheat antivirus"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
chrono.workspace = true
uuid.workspace = true

# Hashing
sha2 = "0.10"
md-5 = "0.10"
sha1 = "0.10"

# PE Parsing
goblin = "0.8"

# Database
rusqlite = { version = "0.31", features = ["bundled"] }

# File watching
notify = "6.0"
walkdir = "2.0"

# Networking
reqwest = { version = "0.12", features = ["json"] }

# Archive scanning
zip = "2.0"

# Regex for string extraction
regex = "1.0"

# Hex encoding
hex = "0.4"

# Encryption for quarantine vault
aes-gcm = "0.10"
rand = "0.8"

# Fuzzy hashing
tlsh2 = "0.3"

# Base64
base64 = "0.22"

[dev-dependencies]
tempfile = "3.0"
