[package]
name = "anticheat-desktop"
version = "0.1.0"
edition = "2021"
description = "AntiCheat desktop GUI"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
anticheat-engine = { path = "../../engine" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
