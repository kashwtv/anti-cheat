name: Release

# Build AntiCheat artifacts for every push of a `v*` tag and attach them
# to a GitHub Release. Three matrix jobs run in parallel:
#
#   1. linux-cross-exe  — builds the CLI .exe on Ubuntu via cargo-xwin.
#                         This lets you verify the cross-compile path too.
#   2. windows-gui      — builds the Tauri desktop .msi + .exe installer
#                         on a real Windows runner (the only sane way).
#   3. linux-native     — builds the Linux CLI + service binaries.
#
# Trigger manually via the "workflow_dispatch" button or by pushing a tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-cross-exe:
    name: CLI .exe (linux -> windows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install cargo-xwin
        run: cargo install cargo-xwin --locked

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-xwin-${{ hashFiles('**/Cargo.lock') }}

      - name: Package Windows CLI
        run: BACKEND=xwin bash scripts/package-windows.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: anticheat-windows-cli
          path: dist/AntiCheat-windows-x64-*.zip

  windows-gui:
    name: Desktop GUI (windows installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Build desktop app
        working-directory: ui
        run: cargo tauri build

      - name: Collect installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/windows-gui | Out-Null
          Copy-Item ui/src-tauri/target/release/bundle/msi/*.msi dist/windows-gui/ -ErrorAction SilentlyContinue
          Copy-Item ui/src-tauri/target/release/bundle/nsis/*.exe dist/windows-gui/ -ErrorAction SilentlyContinue
          Copy-Item ui/src-tauri/target/release/anticheat-desktop.exe dist/windows-gui/ -ErrorAction SilentlyContinue

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: anticheat-windows-gui
          path: dist/windows-gui/*

  linux-native:
    name: Linux CLI + service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-native-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: |
          cargo build --release -p anticheat-cli
          cargo build --release -p anticheat-service || true

      - name: Bundle
        run: |
          mkdir -p dist/AntiCheat-linux-x64
          cp target/release/anticheat dist/AntiCheat-linux-x64/
          cp target/release/anticheat-service dist/AntiCheat-linux-x64/ || true
          cp README.md dist/AntiCheat-linux-x64/README.md || true
          tar -C dist -czf dist/AntiCheat-linux-x64.tar.gz AntiCheat-linux-x64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: anticheat-linux
          path: dist/AntiCheat-linux-x64.tar.gz

  publish:
    name: Publish GitHub Release
    needs: [linux-cross-exe, windows-gui, linux-native]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/anticheat-windows-cli/*
            artifacts/anticheat-windows-gui/*
            artifacts/anticheat-linux/*
          generate_release_notes: true
